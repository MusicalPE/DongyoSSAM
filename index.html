<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동요샘 노래상자</title>
<meta name="description" content="동요샘 선생님들이 지은 창작동요를 온 나라 교실이 함께 불러요. 노래 도장, 전국 무대, 동요샘 차트, 이어 부르기 릴레이.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="동요샘 노래상자">
<meta property="og:title" content="동요샘 노래상자">
<meta property="og:description" content="선생님이 지은 동요를 온 나라 교실이 함께 불러요. 노래 도장, 전국 무대, 동요샘 차트, 이어 부르기 릴레이.">
<meta property="og:url" content="https://musicalpe.github.io/DongyoSSAM/">
<meta property="og:image" content="https://musicalpe.github.io/DongyoSSAM/img/og-logo.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#DDF0FF">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="동요샘">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 그림책 한 장면(하늘·해·구름·언덕) 머리 + 크레파스 색 탭, 카드는 스케치북 종이처럼 살짝 삐뚤고 손으로 그린 테두리 */
:root{
  --sky:#DDF0FF; --bg:#F3FAFF; --paper:#FFFFFF; --ink:#2B3A55; --muted:#61708A; --line:#C9D8E8; --pencil:#3B4A66;
  --c0:#F0645A; --c1:#F7953E; --c2:#F2C230; --c3:#4FB36A; --c4:#4A8FE0; --c5:#9A7AD6;
  --c0-soft:#FDE3E0; --c1-soft:#FEEBD8; --c2-soft:#FDF3CF; --c3-soft:#DDF3E3; --c4-soft:#DFEBFB; --c5-soft:#ECE5FA;
  --hill1:#9BD7A0; --hill2:#7CC488; --sun:#FFCF3F; --cloud:#FFFFFF;
  --accent:#4A8FE0; --leaf:#3FA25E; --on-accent:#FFFFFF; --shadow:#B9CCE0;
  --heat0:#EEF4F9; --heat1:#DDF3E3; --heat2:#ABDDB6; --heat3:#6FC283; --heat4:#3FA25E;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --hand:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wob:20px 26px 18px 28px / 26px 18px 28px 20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#1A2444; --bg:#121A30; --paper:#1D2742; --ink:#EEF2FA; --muted:#A3B0C8; --line:#34426A; --pencil:#C9D3E6;
  --c0:#FF8A80; --c1:#FFB06A; --c2:#FFD866; --c3:#7FD694; --c4:#82B4F5; --c5:#BBA2F0;
  --c0-soft:#3C2733; --c1-soft:#3C2E2A; --c2-soft:#3A3526; --c3-soft:#21372F; --c4-soft:#223252; --c5-soft:#30294F;
  --hill1:#244A3A; --hill2:#1B3B2E; --sun:#FBE9A6; --cloud:#3A4770;
  --accent:#82B4F5; --leaf:#7FD694; --on-accent:#10182A; --shadow:#0B1022;
  --heat0:#1F2A44; --heat1:#21372F; --heat2:#2C5A42; --heat3:#4E9A68; --heat4:#7FD694; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1A2444; --bg:#121A30; --paper:#1D2742; --ink:#EEF2FA; --muted:#A3B0C8; --line:#34426A; --pencil:#C9D3E6;
  --c0:#FF8A80; --c1:#FFB06A; --c2:#FFD866; --c3:#7FD694; --c4:#82B4F5; --c5:#BBA2F0;
  --c0-soft:#3C2733; --c1-soft:#3C2E2A; --c2-soft:#3A3526; --c3-soft:#21372F; --c4-soft:#223252; --c5-soft:#30294F;
  --hill1:#244A3A; --hill2:#1B3B2E; --sun:#FBE9A6; --cloud:#3A4770;
  --accent:#82B4F5; --leaf:#7FD694; --on-accent:#10182A; --shadow:#0B1022;
  --heat0:#1F2A44; --heat1:#21372F; --heat2:#2C5A42; --heat3:#4E9A68; --heat4:#7FD694; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;overflow-x:clip}
main,section,.card,.list,.concert{min-width:0}
/* 머리 장면 */
.scene{position:relative;background:linear-gradient(to bottom,var(--sky),var(--bg));overflow:hidden}

.scene .title{position:absolute;left:0;right:0;top:26px;margin:0 auto;max-width:760px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1.1;color:var(--ink);text-shadow:0 2px 0 var(--paper)}
.scene h1 .r0{color:var(--c0)}.scene h1 .r1{color:var(--c1)}.scene h1 .r2{color:var(--c3)}.scene h1 .r3{color:var(--c4)}
.scene p{font-family:var(--body);font-weight:500;font-size:15px;margin:4px 0 0;color:var(--pencil)}
.float{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 4s ease-in-out infinite}.f2{animation-delay:-1.3s}.f3{animation-delay:-2.6s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
  .cloud{animation:drift 30s linear infinite alternate}@keyframes drift{to{transform:translateX(26px)}}}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.example{font-family:var(--body);font-size:13.5px;color:var(--pencil);background:var(--c2-soft);border-radius:var(--wob);padding:6px 12px;margin:6px 0 0;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* 크레파스 탭 */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:6px;overflow-x:auto}
nav button{--c:var(--c4);--cs:var(--c4-soft);font-family:var(--body);font-weight:700;font-size:15px;border:2px solid var(--c);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;white-space:nowrap;cursor:pointer}
nav button:nth-child(1){--c:var(--c0)}nav button:nth-child(2){--c:var(--c1)}nav button:nth-child(3){--c:var(--c3)}nav button:nth-child(4){--c:var(--c4)}nav button:nth-child(5){--c:var(--c5)}
nav button[aria-selected="true"]{background:var(--c);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px dashed var(--accent);outline-offset:2px}
section{display:grid;gap:16px;margin-top:10px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:12px 0 0;display:flex;align-items:center;gap:8px}
h2::before{content:"\266A";color:var(--c3);font-size:22px;line-height:1}
section h2:nth-of-type(2n)::before{color:var(--c0)}
.sub{color:var(--muted);font-size:13.5px;margin:-10px 0 0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:18px;display:grid;gap:10px}
.eyebrow{font-family:var(--body);font-size:14px;font-weight:700;color:var(--c1);line-height:1.2}
.today{border-color:var(--pencil);box-shadow:4px 5px 0 var(--shadow);transform:rotate(-.4deg);position:relative}
.today::after{content:"";position:absolute;top:-10px;left:50%;width:76px;height:20px;margin-left:-38px;background:var(--c2);opacity:.55;transform:rotate(-3deg);border-radius:3px}
.today h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.today blockquote{margin:0;padding:4px 14px;border-radius:var(--wob);white-space:pre-line;line-height:2em;font-family:var(--body);font-weight:500;font-size:17px;
  background:var(--c4-soft) repeating-linear-gradient(to bottom,transparent 0 calc(2em - 1px),var(--line) calc(2em - 1px) 2em)}
.meta{color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--body);font-weight:700;font-size:15px;border:2px solid var(--pencil);border-radius:14px 18px 14px 18px / 18px 14px 18px 14px;padding:7px 14px;cursor:pointer;background:var(--accent);color:var(--on-accent);box-shadow:2px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.done{background:var(--leaf);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.list{display:grid;gap:10px}
.song{--c:var(--c4);--cs:var(--c4-soft);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px;cursor:pointer}
.song:hover{border-color:var(--c);transform:rotate(-.6deg)}
.key{width:44px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-weight:700;font-size:16px;background:var(--cs);color:var(--ink);border:2px solid var(--c);transform:rotate(-14deg);position:relative}
.key::after{content:"";position:absolute;right:-1px;bottom:20px;width:3px;height:22px;background:var(--c);border-radius:2px;transform:rotate(14deg)}
.key.stamped{background:var(--c);color:var(--on-accent)}
.song b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.song small{color:var(--muted);font-size:12.5px}
.min{min-width:0}
.side{font-family:var(--body);font-weight:500;font-size:13px;color:var(--pencil);text-align:right;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13.5px;border:2px dashed var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c3-soft);border:2px solid var(--c3);color:var(--ink)}
.tag{font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--ink);background:var(--c3-soft);border-radius:999px;padding:0 10px}
.concert{display:grid;gap:10px;padding:14px;border-radius:var(--wob);background:var(--c2-soft)}
.concert h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
input[type=search],input[type=text],select,textarea{font:inherit;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:var(--body);font-size:16px;line-height:1.8}
.label{font-family:var(--body);font-size:13.5px;font-weight:700;color:var(--pencil)}
.empty{font-family:var(--body);font-size:15px;color:var(--muted);background:var(--paper);border:2px dashed var(--line);border-radius:var(--wob);padding:18px;text-align:center}
/* 전국 무대 */
.tilemap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:420px}
.tile{aspect-ratio:1.25;max-width:100%;min-width:0;overflow:hidden;border-radius:46% 54% 42% 58% / 55% 45% 55% 45%;display:grid;place-content:center;text-align:center;font-size:13px;line-height:1.2;color:var(--ink)}
.tile b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.tile.hot{color:var(--on-accent)}
.tile.mine{outline:3px solid var(--c1);outline-offset:2px}
.legend{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{width:18px;height:10px;border-radius:5px;display:inline-block}
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:28px 52px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px}
.rrow .n{font-family:var(--display);color:var(--muted);text-align:center}
.rrow.top .n{color:var(--c1)}
.bar{height:12px;background:var(--heat0);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--c3) 0 6px,var(--leaf) 6px 12px);border-radius:999px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.relay{display:grid;gap:0}
.rstep{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.rstep .dot{width:16px;height:13px;border-radius:50%;background:var(--c4);margin-top:9px;position:relative;transform:rotate(-20deg)}
.rstep:nth-child(3n+2) .dot{background:var(--c0)}.rstep:nth-child(3n) .dot{background:var(--c3)}
.rstep:not(:last-child) .dot::after{content:"";position:absolute;left:6px;top:14px;width:0;height:44px;border-left:2px dashed var(--line);transform:rotate(20deg)}
.rstep.next .dot{background:transparent;border:2px dashed var(--c1)}
.rstep p{margin:0 0 10px;font-family:var(--body);font-weight:500;font-size:16px;line-height:1.5}
.rstep small{font-family:var(--body);font-size:12.5px;color:var(--muted)}
/* 차트 */
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px}
.crow .n{font-family:var(--display);font-size:22px;text-align:center;color:var(--muted)}
.crow.p1{border-color:var(--c2);background:var(--c2-soft)}.crow.p1 .n{color:var(--c1)}
.crow.p2 .n,.crow.p3 .n{color:var(--c1)}
.crow b{font-family:var(--display);font-weight:400;font-size:17px;cursor:pointer}
.vote{font-family:var(--body);font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.vote.on{background:var(--c2);border-color:var(--c1);color:#3A2A00}
/* 우리 반 */
.stampbook{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;border-radius:var(--wob);background:var(--paper);border:2px solid var(--line)}
@media (max-width:480px){.stampbook{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stamp{--c:var(--c0);aspect-ratio:1;width:100%;max-width:100%;min-width:0;min-height:0;overflow:hidden;overflow-wrap:anywhere;border-radius:50%;border:2px dashed var(--line);display:grid;place-content:center;text-align:center;font-family:var(--hand);font-size:14px;line-height:1.15;color:var(--muted);padding:6px;cursor:pointer;background:transparent}
.stamp.on{border:3px double var(--c);color:var(--c);background:var(--paper);transform:rotate(-8deg)}
.stamp.on b{font-family:var(--display);font-weight:400;font-size:13px;display:block}
.level{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level b{font-family:var(--display);font-weight:400;font-size:24px}
.prog{height:14px;background:var(--heat0);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.prog span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--c3) 0 6px,var(--leaf) 6px 12px)}
.quest{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px}
.quest .ok{width:20px;height:20px;border-radius:6px 8px 6px 8px;border:2px solid var(--line)}
.quest.cleared .ok{background:var(--c3);border-color:var(--leaf)}
.quest.cleared span:nth-child(2){text-decoration:line-through wavy var(--c3)}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form2>*{min-width:0}
@media (max-width:420px){.form2{grid-template-columns:minmax(0,1fr)}}
/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(18,26,48,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow:auto;background:var(--bg);border-top:3px solid var(--pencil);border-radius:26px 30px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:680px;margin:0 auto;display:grid;gap:14px;min-width:0}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.sheet h4{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 0}
.lyrics{white-space:pre-line;border-radius:var(--wob);padding:6px 16px;line-height:2em;font-family:var(--body);font-weight:500;font-size:18px;border:2px solid var(--line);
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 calc(2em - 1px),var(--c4-soft) calc(2em - 1px) 2em)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.facts div{background:var(--paper);border:2px solid var(--line);border-radius:14px 18px 14px 18px;padding:8px 10px}
.facts dt{font-family:var(--body);font-size:12.5px;color:var(--muted)}
.facts dd{margin:0}
.tip{background:var(--c2-soft);border-radius:var(--wob);padding:12px 14px;transform:rotate(.4deg)}
.variant{border:2px solid var(--line);background:var(--paper);border-radius:var(--wob);padding:12px;display:grid;gap:6px}
.variant .v{white-space:pre-line;font-family:var(--body);font-size:16px;line-height:1.7}
.variant footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.close{justify-self:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:15px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}
  .stamp.on{animation:press .3s ease-out}@keyframes press{from{transform:scale(1.35) rotate(-8deg)}}}
.status{display:inline-block;margin-top:8px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:999px;padding:2px 12px}
.status.on{color:var(--ink);border-style:solid;border-color:var(--c3);background:var(--c3-soft)}
a.btn{text-decoration:none;display:inline-block}
input[type=number],input[type=password]{font:inherit;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
body.busy{cursor:progress}body.busy .btn,body.busy .stamp,body.busy .vote{pointer-events:none;opacity:.7}
.oprow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px}
.oprow.off{opacity:.55}
.oprow .key{font-size:13px}
.oprow b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.warn{margin:0;font-size:13.5px;color:var(--ink);background:var(--c0-soft);border-radius:10px;padding:6px 10px}
.fld{display:grid;gap:4px;min-width:0}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.form3>*{min-width:0}
textarea.plain{font-family:var(--body);font-size:15px;line-height:1.6;min-height:80px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.foot{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
.linkbtn{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.rrow.mine{outline:3px solid var(--c1);outline-offset:2px;border-radius:12px;background:var(--c1-soft)}
.rank{padding-inline:20px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.tops{grid-template-columns:minmax(0,1fr)}}

/* ===== 꾸밈: 둥근 카드·입체 메뉴·LP·지도·단상·스티커판·탐험 지도·계절 하늘·플레이어 ===== */

/* 2. 둥근 카드 + 파스텔 그림자 */
.card, .song, .crow, .concert, .variant, .stampbook, .oprow, .cafe, .hero, .topcard {
  border-radius: 20px !important;
}
.card, .song, .crow, .hero, .topcard, .stampbook {
  border: 1.5px solid color-mix(in srgb, var(--line) 70%, transparent) !important;
  box-shadow: 0 8px 22px rgba(74, 143, 224, .13), 0 2px 0 rgba(74, 143, 224, .06) !important;
}
.today { transform: none !important; border: 2px solid var(--c4-soft) !important; box-shadow: 0 10px 28px rgba(240, 100, 90, .14) !important; }
.today::after { display: none }

/* 1. 머리: 음악 보물상자 + 떠다니는 구름 + 반짝 음표 */
.cloud { animation: drift 9s ease-in-out infinite alternate !important }
@keyframes drift { to { transform: translateX(22px) } }
.sparkle { animation: sp 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
@keyframes sp { 50% { opacity: .2; transform: scale(.5) } }

/* 4. 왼쪽 메뉴: 아이콘 + 톡 튀어나온 3D 버튼 */
@media (min-width:1000px) {
  nav { background: var(--paper) !important; box-shadow: 0 8px 22px rgba(74,143,224,.12); border-radius: 22px !important; }
  nav button { display: flex !important; align-items: center; gap: 10px; border-width: 0 !important; background: var(--cs, var(--c4-soft)) !important;
    box-shadow: 0 5px 0 var(--c) !important; margin-bottom: 4px; transform: translateY(0); }
  nav button[aria-selected="true"] { background: var(--c) !important; color: #fff !important; box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 60%, #000) !important; }
}
nav button:nth-child(1){--cs:var(--c0-soft)} nav button:nth-child(2){--cs:var(--c1-soft)} nav button:nth-child(3){--cs:var(--c3-soft)} nav button:nth-child(4){--cs:var(--c4-soft)} nav button:nth-child(5){--cs:var(--c5-soft)}
.navi { width: 22px; height: 22px; flex: none }
@media (max-width:999px) { .navi { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px } nav button { box-shadow: 0 3px 0 var(--c) } }

/* 2. 오늘의 동요: LP 턴테이블 카드 */
.today { display: grid !important; grid-template-columns: 176px minmax(0,1fr); column-gap: 20px; align-items: start }
.today > * { grid-column: 2 }
.today > .turntable { grid-column: 1; grid-row: 1 / span 9 }
.turntable { position: relative; width: 176px; height: 176px; border-radius: 22px; background: linear-gradient(145deg, #F7D9A8, #E9B978); box-shadow: inset 0 -6px 0 rgba(0,0,0,.08) }
.lp { position: absolute; left: 14px; top: 14px; width: 140px; height: 140px; border-radius: 50%;
  background: repeating-radial-gradient(circle, #23263A 0 3px, #2E3250 3px 5px); box-shadow: 0 6px 14px rgba(0,0,0,.25); animation: spin 6s linear infinite }
.lp::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 20%, rgba(255,255,255,.12) 25%, transparent 30% 70%, rgba(255,255,255,.1) 75%, transparent 80%) }
.lp-label { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--c0);
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 11px; line-height: 1.1; text-align: center; padding: 6px }
.lp-label::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #23263A; left: 25px; top: 25px }
.arm { position: absolute; right: 10px; top: 10px; width: 10px; height: 104px; border-radius: 6px; background: #C9CED8; transform-origin: 5px 5px; transform: rotate(24deg) }
.arm::before { content: ""; position: absolute; left: -5px; top: -5px; width: 20px; height: 20px; border-radius: 50%; background: #9AA3B5 }
.arm::after { content: ""; position: absolute; left: -3px; bottom: -6px; width: 16px; height: 16px; border-radius: 4px; background: #6B7488 }
@keyframes spin { to { transform: rotate(360deg) } }
@media (max-width:700px) {
  .today { grid-template-columns: 1fr }
  .today > *, .today > .turntable { grid-column: 1; grid-row: auto }
  .turntable { justify-self: center; margin-bottom: 4px }
}

/* 4. 언제든 듣기: 아래 고정 플레이어 바 */
.playerbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom,0px)); z-index: 15;
  width: min(720px, calc(100% - 24px)); display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center;
  background: #2B3A55; color: #fff; border-radius: 999px; padding: 8px 10px 8px 8px; box-shadow: 0 10px 26px rgba(43,58,85,.35) }
.playerbar .mini-lp { width: 44px; height: 44px; border-radius: 50%; background: repeating-radial-gradient(circle, #23263A 0 2px, #3A3F60 2px 4px); position: relative; animation: spin 6s linear infinite }
.playerbar .mini-lp::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--c0) }
.playerbar b { display: block; font-family: var(--display); font-weight: 400; font-size: 16px }

.playerbar .pb { display: flex; gap: 6px }

.playerbar .pb > .main { background: #F2C230 }
.playerbar .pb > *:focus-visible, .pl-title:focus-visible { outline: 2px solid #F2C230; outline-offset: 2px }
.pl-title { all: unset; cursor: pointer; min-width: 0; display: grid; color: #fff }

body { padding-bottom: 80px }

/* 2. 전국 무대: 대한민국 지도 + 지역 도장 */
.kmap { width: 100%; max-width: 440px; display: block; margin: 0 auto }
.kmap .land { fill: var(--c3-soft); stroke: var(--c3); stroke-width: 3; stroke-linejoin: round }

.kmap text { font-family: var(--body); font-weight: 700; text-anchor: middle; fill: #fff; paint-order: stroke; }

.kmap .rnum { font-size: 11px; stroke: none }
.kmap .kung { font-family: var(--display); font-size: 20px; fill: var(--c1); stroke: var(--paper); stroke-width: 4; font-weight: 400 }

/* 3. 차트: 1~3위 단상 */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); align-items: end; gap: 8px; padding: 6px 4px 0 }
.pod { display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0 }
.pod b { font-family: var(--display); font-weight: 400; font-size: 15px; line-height: 1.25; word-break: keep-all }
.pod .block { width: 100%; border-radius: 14px 14px 6px 6px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 28px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12) }
.pod.p1 .block { height: 110px; background: linear-gradient(#FFD45E, #F2B630) } .pod.p2 .block { height: 82px; background: linear-gradient(#C8D6E8, #9DB2CC) } .pod.p3 .block { height: 62px; background: linear-gradient(#F7B98A, #E8955B) }
.pod svg { width: 40px; height: 40px }
.pod small { color: var(--muted); font-size: 12px }

/* 3. 우리 반: 칭찬 스티커판 + 탐험 지도 + 쿵 효과 */
.stampbook { background: #FFF6DE repeating-linear-gradient(0deg, transparent 0 26px, rgba(214,180,120,.25) 26px 27px) !important; border: 3px dashed #E6C48A !important; position: relative }

.stamp { border-radius: 50% !important; border: 2px dashed #E3C79A !important; color: #B9985E !important; background: rgba(255,255,255,.6) !important; font-size: 12px !important }
.stamp.on { border: none !important; color: #fff !important; transform: rotate(-8deg); background: var(--c) !important;
  clip-path: polygon(50% 0%,61% 12%,76% 6%,80% 22%,95% 25%,91% 40%,100% 50%,91% 60%,95% 75%,80% 78%,76% 94%,61% 88%,50% 100%,39% 88%,24% 94%,20% 78%,5% 75%,9% 60%,0% 50%,9% 40%,5% 25%,20% 22%,24% 6%,39% 12%) }
.stamp.on b { color: #fff !important }
.cell { position: relative; display: block; min-width: 0 }
.kung-fx { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; pointer-events: none; overflow: visible; z-index: 2; animation: kungfx 1.4s ease-out forwards }
@keyframes kungfx { 0% { opacity: 0 } 12% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
.kung-word { position: absolute; right: -6px; top: -10px; z-index: 3; pointer-events: none; animation: kungfade 1.4s ease-out forwards; font-family: var(--display); font-size: 26px; color: var(--c0); -webkit-text-stroke: 4px #fff; paint-order: stroke fill; transform: rotate(-10deg) }
.quest-map { position: relative; padding-left: 8px }
.quest-map .quest { position: relative; padding: 8px 0 8px 34px !important; grid-template-columns: minmax(0,1fr) auto !important }
.quest-map .quest .ok { position: absolute; left: 0; top: 50%; margin-top: -12px; width: 24px !important; height: 24px !important; border-radius: 50% !important; border: 3px solid var(--line) !important; background: var(--paper) }
.quest-map .quest.cleared .ok { background: var(--c3) !important; border-color: var(--c3) !important }
.quest-map .quest:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 50%; height: 100%; border-left: 3px dashed var(--c1) }
.quest-map .flag { position: absolute; left: -2px; top: -26px; font-family: var(--display); font-size: 13px; color: var(--c1) }
.quest-map .goal { font-family: var(--display); color: var(--c0); padding-left: 34px; margin-top: 4px }

/* 팁: 계절 테마 머리 그림 */
.season-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0 }

@keyframes kungfade { 0% { opacity: 0; transform: scale(.6) rotate(-10deg) } 15% { opacity: 1; transform: scale(1.15) rotate(-10deg) } 70% { opacity: 1 } 100% { opacity: 0 } }
.season-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0 }

/* 유튜브 주소에서 영상 번호 꺼내기 */
function ytId(u) {
  const m = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/.exec(String(u || ""));
  return m ? m[1] : "";
}
/* 구글 드라이브 파일 주소에서 파일 번호 꺼내기 (노래 mp3·영상 mp4) */
function driveId(u) {
  const m = /drive\.google\.com\/(?:file\/d\/|open\?(?:.*&)?id=|uc\?(?:.*&)?id=)([A-Za-z0-9_-]{20,})/.exec(String(u || ""));
  return m ? m[1] : "";
}
/* 화면 안에서 틀 수 있는 주소로 바꾸기: 유튜브, 구글 드라이브 */
function embedSrc(u) {
  const y = ytId(u); if (y) return `https://www.youtube-nocookie.com/embed/${y}?rel=0&autoplay=1&playsinline=1`;
  const d = driveId(u); if (d) return `https://drive.google.com/file/d/${d}/preview`;
  return "";
}
/* 아래 플레이어로 틀 것: 노래 파일이 있으면 노래, 없으면 영상 */
const playSrc = s => s ? (embedSrc(s.audio) || embedSrc(s.video)) : "";
const playIsAudio = s => !!(s && embedSrc(s.audio));
const MEDIA = { audio: ["노래 듣기", "노래 닫기", "노래"], video: ["영상 보기", "영상 닫기", "영상"], score: ["악보 보기", "악보 닫기", "악보"] };
/* 곡 창 안의 재생·보기 칸: 노래 파일, 영상, 악보 가운데 하나 */
function mediaBox(s, kind) {
  const src = embedSrc(s[kind]); if (!src) return "";
  if (kind !== "score" && document.querySelector(".mini-video")) { const c = document.querySelector('.mini-video [data-mv="close"]'); if (c) c.click(); }
  return `<div class="vbox ${kind}" data-kind="${kind}"><iframe src="${src}" title="${esc(s.title)} ${MEDIA[kind][2]}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
}
function mediaBtn(s, kind) {
  const [show, , word] = MEDIA[kind], v = s[kind];
  if (embedSrc(v)) return `<button class="btn ghost" data-media="${kind}" data-id="${s.id}">${show}</button>`;
  if (v) return `<a class="btn ghost" href="${esc(v)}" target="_blank" rel="noopener">${show}</a>`;
  return kind === "audio" ? "" : `<button class="btn ghost" disabled>${word} 준비 중</button>`;
}

const KARA = { id: 0, i: 0, size: store.get("dys-kara-size", 1), auto: 0, t: 0 };
function karaLines(s) { return String(s.lyrics || "").split("\n").map(x => x.trim()).filter(Boolean); }
function openKaraoke(id) {
  const s = songById(id); if (!s) return;

function drawKaraoke() {

    <div class="k-stage" data-kzone>

function karaStep(d) { const s = songById(KARA.id); if (!s) return; const n = karaLines(s).length; KARA.i = Math.max(0, Math.min(n - 1, KARA.i + d)); if (KARA.auto && KARA.i >= n - 1) { clearInterval(KARA.t); KARA.auto = 0; } drawKaraoke(); }

document.addEventListener("click", e => {
  const k = e.target.closest(".kara"); if (!k) return;
  e.stopPropagation();

  const a = b.dataset.k;

async function opEnsure() {

function monthAdd(m, n) { const [y, mo] = m.split("-").map(Number), d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function monthDays(m) { const [y, mo] = m.split("-").map(Number), n = new Date(y, mo, 0).getDate(); return Array.from({ length: n }, (_, i) => m + "-" + String(i + 1).padStart(2, "0")); }

function opDraftLoad(m) {

function csvDownload(name, head, rows) {
  const q = v => { const s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const text = "﻿" + [head].concat(rows).map(r => r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  const KC = Math.cos(36 * Math.PI / 180);

  function koreaMap() {
    const sc = regionsNow(), max = Math.max(1, ...Object.values(sc).map(x => x.stamps));
    let land = "", marks = "", mine = "";
    Object.entries(KMAP.paths).forEach(([r, d]) => { land += `<path class="prov${r === ME.region ? " me" : ""}" d="${d}" fill="${FILL[r] || "#ddd"}"/>`; });
    Object.entries(CENTER).forEach(([r, ll], i) => {
      const [x, y] = P(...ll), n = sc[r] ? sc[r].stamps : 0, rad = 8 + Math.sqrt(n / max) * 11;
      marks += `<g><circle class="stampc" cx="${x}" cy="${y}" r="${rad}" fill="${COLORS[i % 5]}" opacity="${n ? .95 : .4}"/><text class="rnum" x="${x}" y="${y + 4}">${n}</text><text class="rname" x="${x}" y="${y + rad + 12}">${r}</text></g>`;
      if (r === ME.region) mine = `<circle cx="${x}" cy="${y}" r="${rad + 6}" fill="none" stroke="#F7953E" stroke-width="3" stroke-dasharray="4 3"/><text class="kung" x="${x + rad + 20}" y="${y - rad}">쿵!</text>`;
    });
    return `<svg class="kmap" viewBox="0 0 ${KMAP.w} ${KMAP.h}" role="img" aria-label="시도별 도장 수 지도">${land}${marks}${mine}</svg>`;
  }

  function enhance() {
    document.querySelectorAll("#tabs button").forEach(b => { if (!b.querySelector(".navi")) b.insertAdjacentHTML("afterbegin", `<svg class="navi" viewBox="0 0 24 24" aria-hidden="true">${ICON[b.dataset.tab] || ""}</svg>`); });
    const scene = document.querySelector(".scene");
    if (scene && !scene.querySelector(".season-layer")) {
      const k = seasonKey(); scene.classList.add("s-" + k);
      scene.insertAdjacentHTML("afterbegin", `<svg class="season-layer" viewBox="0 0 1200 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SEASON[k]}</svg>`);
    }
    const today = document.querySelector(".today");
    if (today && !today.querySelector(".turntable")) {
      const t = today.querySelector("h3") ? today.querySelector("h3").textContent : "";
      today.insertAdjacentHTML("afterbegin", `<div class="turntable" aria-hidden="true"><div class="lp"><span class="lp-label">${esc(t)}</span></div><div class="arm"></div></div>`);
    }
    const tm = document.querySelector(".tilemap");
    if (tm) { tm.outerHTML = koreaMap(); const lg = document.querySelector(".legend"); if (lg) lg.textContent = "동그라미가 클수록 도장이 많아요 · 쿵! 찍힌 곳이 우리 지역 · 시도 경계: 통계청(2013)"; }
    const tops = document.querySelector(".tops");
    if (tops) {
      const sung = chartMode === "sung", val = s => sung ? sungIn(s.id) : votesFor(s.id);
      const list = SONGS.slice().sort((a, b) => val(b) - val(a)).slice(0, 3);
      const trophy = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0z" fill="#F2C230" stroke="#B07A2A" stroke-width="1.4"/><path d="M12 13v4M8 20h8" stroke="#B07A2A" stroke-width="2" stroke-linecap="round"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="#B07A2A" stroke-width="1.6"/></svg>';
      const pod = (s, k) => s ? `<button class="pod p${k}" data-open="${s.id}">${k === 1 ? trophy : ""}<b>${esc(s.title)}</b><small>${sung ? val(s) + "개 반" : val(s) + "표"}</small><span class="block">${k}</span></button>` : "<span></span>";
      tops.outerHTML = `<div class="card"><span class="eyebrow">${sung ? (PERIOD === "year" ? "올해" : "이번 달") + " 가장 많이 불린 노래" : MONTH_LABEL() + " 투표 단상"}</span><div class="podium">${pod(list[1], 2)}${pod(list[0], 1)}${pod(list[2], 3)}</div></div>`;
    }
    if (kungId) {
      const on = document.querySelector(`.stampbook .stamp.on[data-stamp="${kungId}"]`);
      if (on && on.parentElement.classList.contains("cell") && !on.parentElement.querySelector(".kung-fx")) {
        let rays = "";
        for (let i = 0; i < 10; i++) {
          const a = i * 36 * Math.PI / 180;
          rays += `<path d="M${Math.cos(a) * 58} ${Math.sin(a) * 58} L${Math.cos(a) * 80} ${Math.sin(a) * 80}" stroke="${COLORS[i % 5]}" stroke-width="5" stroke-linecap="round"/><circle cx="${Math.cos(a + .3) * 72}" cy="${Math.sin(a + .3) * 72}" r="3.5" fill="${COLORS[(i + 2) % 5]}"/>`;
        }
        on.parentElement.insertAdjacentHTML("beforeend", `<svg class="kung-fx" viewBox="-100 -100 200 200" aria-hidden="true">${rays}</svg><span class="kung-word">쿵!</span>`);
      }
    }
    document.querySelectorAll("h2").forEach(h => {
      if (h.textContent.trim() !== "노래 탐험 지도") return;
      const card = h.nextElementSibling;
      if (card && card.classList.contains("card") && !card.classList.contains("quest-map")) { card.classList.add("quest-map"); card.insertAdjacentHTML("beforeend", '<div class="goal">도착! 동요샘 명예반</div>'); }
    });
    renderPlayer();
  }
  const orig = window.render;
  window.render = function () { orig.apply(this, arguments); try { enhance(); } catch (e) { console.error(e); } };
  window.render();
