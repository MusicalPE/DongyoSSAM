<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동요샘 노래상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 그림책 한 장면(하늘·해·구름·언덕) 머리 + 크레파스 색 탭, 카드는 스케치북 종이처럼 살짝 삐뚤고 손으로 그린 테두리 */
:root{
  --sky:#DDF0FF; --bg:#F3FAFF; --paper:#FFFFFF; --ink:#2B3A55; --muted:#61708A; --line:#C9D8E8; --pencil:#3B4A66;
  --c0:#F0645A; --c1:#F7953E; --c2:#F2C230; --c3:#4FB36A; --c4:#4A8FE0; --c5:#9A7AD6;
  --c0-soft:#FDE3E0; --c1-soft:#FEEBD8; --c2-soft:#FDF3CF; --c3-soft:#DDF3E3; --c4-soft:#DFEBFB; --c5-soft:#ECE5FA;
  --hill1:#9BD7A0; --hill2:#7CC488; --sun:#FFCF3F; --cloud:#FFFFFF;
  --accent:#4A8FE0; --leaf:#3FA25E; --on-accent:#FFFFFF; --shadow:#B9CCE0;
  --heat0:#EEF4F9; --heat1:#DDF3E3; --heat2:#ABDDB6; --heat3:#6FC283; --heat4:#3FA25E;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --hand:"Gaegu","Jua",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wob:20px 26px 18px 28px / 26px 18px 28px 20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#1A2444; --bg:#121A30; --paper:#1D2742; --ink:#EEF2FA; --muted:#A3B0C8; --line:#34426A; --pencil:#C9D3E6;
  --c0:#FF8A80; --c1:#FFB06A; --c2:#FFD866; --c3:#7FD694; --c4:#82B4F5; --c5:#BBA2F0;
  --c0-soft:#3C2733; --c1-soft:#3C2E2A; --c2-soft:#3A3526; --c3-soft:#21372F; --c4-soft:#223252; --c5-soft:#30294F;
  --hill1:#244A3A; --hill2:#1B3B2E; --sun:#F4E7A8; --cloud:#3A4770;
  --accent:#82B4F5; --leaf:#7FD694; --on-accent:#10182A; --shadow:#0B1022;
  --heat0:#1F2A44; --heat1:#21372F; --heat2:#2C5A42; --heat3:#4E9A68; --heat4:#7FD694; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1A2444; --bg:#121A30; --paper:#1D2742; --ink:#EEF2FA; --muted:#A3B0C8; --line:#34426A; --pencil:#C9D3E6;
  --c0:#FF8A80; --c1:#FFB06A; --c2:#FFD866; --c3:#7FD694; --c4:#82B4F5; --c5:#BBA2F0;
  --c0-soft:#3C2733; --c1-soft:#3C2E2A; --c2-soft:#3A3526; --c3-soft:#21372F; --c4-soft:#223252; --c5-soft:#30294F;
  --hill1:#244A3A; --hill2:#1B3B2E; --sun:#F4E7A8; --cloud:#3A4770;
  --accent:#82B4F5; --leaf:#7FD694; --on-accent:#10182A; --shadow:#0B1022;
  --heat0:#1F2A44; --heat1:#21372F; --heat2:#2C5A42; --heat3:#4E9A68; --heat4:#7FD694; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;overflow-x:clip}
main,section,.card,.list,.concert{min-width:0}
/* 머리 장면 */
.scene{position:relative;background:linear-gradient(to bottom,var(--sky),var(--bg));overflow:hidden}
.scene svg{display:block;width:100%;height:150px}
.scene .title{position:absolute;left:0;right:0;top:26px;margin:0 auto;max-width:760px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;line-height:1.1;color:var(--ink);text-shadow:0 2px 0 var(--paper)}
.scene h1 .r0{color:var(--c0)}.scene h1 .r1{color:var(--c1)}.scene h1 .r2{color:var(--c3)}.scene h1 .r3{color:var(--c4)}
.scene p{font-family:var(--hand);font-size:19px;margin:4px 0 0;color:var(--pencil)}
.float{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 4s ease-in-out infinite}.f2{animation-delay:-1.3s}.f3{animation-delay:-2.6s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
  .cloud{animation:drift 30s linear infinite alternate}@keyframes drift{to{transform:translateX(26px)}}}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.example{font-family:var(--hand);font-size:16px;color:var(--pencil);background:var(--c2-soft);border-radius:var(--wob);padding:6px 12px;margin:6px 0 0;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* 크레파스 탭 */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:6px;overflow-x:auto}
nav button{--c:var(--c4);--cs:var(--c4-soft);font-family:var(--display);font-size:15px;border:2px solid var(--c);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;white-space:nowrap;cursor:pointer}
nav button:nth-child(1){--c:var(--c0)}nav button:nth-child(2){--c:var(--c1)}nav button:nth-child(3){--c:var(--c3)}nav button:nth-child(4){--c:var(--c4)}nav button:nth-child(5){--c:var(--c5)}
nav button[aria-selected="true"]{background:var(--c);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px dashed var(--accent);outline-offset:2px}
section{display:grid;gap:16px;margin-top:10px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:12px 0 0;display:flex;align-items:center;gap:8px}
h2::before{content:"\266A";color:var(--c3);font-size:22px;line-height:1}
section h2:nth-of-type(2n)::before{color:var(--c0)}
.sub{color:var(--muted);font-size:13.5px;margin:-10px 0 0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:18px;display:grid;gap:10px}
.eyebrow{font-family:var(--hand);font-size:18px;font-weight:700;color:var(--c1);line-height:1.2}
.today{border-color:var(--pencil);box-shadow:4px 5px 0 var(--shadow);transform:rotate(-.4deg);position:relative}
.today::after{content:"";position:absolute;top:-10px;left:50%;width:76px;height:20px;margin-left:-38px;background:var(--c2);opacity:.55;transform:rotate(-3deg);border-radius:3px}
.today h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.today blockquote{margin:0;padding:4px 14px;border-radius:var(--wob);white-space:pre-line;line-height:2.1em;font-family:var(--hand);font-size:20px;
  background:var(--c4-soft) repeating-linear-gradient(to bottom,transparent 0 calc(2.1em - 1px),var(--line) calc(2.1em - 1px) 2.1em)}
.meta{color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:15px;border:2px solid var(--pencil);border-radius:14px 18px 14px 18px / 18px 14px 18px 14px;padding:7px 14px;cursor:pointer;background:var(--accent);color:var(--on-accent);box-shadow:2px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.done{background:var(--leaf);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
.list{display:grid;gap:10px}
.song{--c:var(--c4);--cs:var(--c4-soft);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px;cursor:pointer}
.song:hover{border-color:var(--c);transform:rotate(-.6deg)}
.key{width:44px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:16px;background:var(--cs);color:var(--ink);border:2px solid var(--c);transform:rotate(-14deg);position:relative}
.key::after{content:"";position:absolute;right:-1px;bottom:20px;width:3px;height:22px;background:var(--c);border-radius:2px;transform:rotate(14deg)}
.key.stamped{background:var(--c);color:var(--on-accent)}
.song b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.song small{color:var(--muted);font-size:12.5px}
.min{min-width:0}
.side{font-family:var(--hand);font-size:16px;color:var(--pencil);text-align:right;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13.5px;border:2px dashed var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c3-soft);border:2px solid var(--c3);color:var(--ink)}
.tag{font-family:var(--hand);font-size:15px;color:var(--ink);background:var(--c3-soft);border-radius:999px;padding:0 10px}
.concert{display:grid;gap:10px;padding:14px;border-radius:var(--wob);background:var(--c2-soft)}
.concert h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
input[type=search],input[type=text],select,textarea{font:inherit;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:var(--hand);font-size:19px;line-height:1.9}
.label{font-family:var(--hand);font-size:17px;font-weight:700;color:var(--pencil)}
.empty{font-family:var(--hand);font-size:18px;color:var(--muted);background:var(--paper);border:2px dashed var(--line);border-radius:var(--wob);padding:18px;text-align:center}
/* 전국 무대 */
.tilemap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:420px}
.tile{aspect-ratio:1.25;max-width:100%;min-width:0;overflow:hidden;border-radius:46% 54% 42% 58% / 55% 45% 55% 45%;display:grid;place-content:center;text-align:center;font-size:13px;line-height:1.2;color:var(--ink)}
.tile b{font-family:var(--display);font-weight:400;font-size:15px;display:block}
.tile.hot{color:var(--on-accent)}
.tile.mine{outline:3px solid var(--c1);outline-offset:2px}
.legend{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{width:18px;height:10px;border-radius:5px;display:inline-block}
.rank{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:28px 52px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px}
.rrow .n{font-family:var(--display);color:var(--muted);text-align:center}
.rrow.top .n{color:var(--c1)}
.bar{height:12px;background:var(--heat0);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--c3) 0 6px,var(--leaf) 6px 12px);border-radius:999px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.relay{display:grid;gap:0}
.rstep{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.rstep .dot{width:16px;height:13px;border-radius:50%;background:var(--c4);margin-top:9px;position:relative;transform:rotate(-20deg)}
.rstep:nth-child(3n+2) .dot{background:var(--c0)}.rstep:nth-child(3n) .dot{background:var(--c3)}
.rstep:not(:last-child) .dot::after{content:"";position:absolute;left:6px;top:14px;width:0;height:44px;border-left:2px dashed var(--line);transform:rotate(20deg)}
.rstep.next .dot{background:transparent;border:2px dashed var(--c1)}
.rstep p{margin:0 0 10px;font-family:var(--hand);font-size:19px;line-height:1.35}
.rstep small{font-family:var(--body);font-size:12.5px;color:var(--muted)}
/* 차트 */
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px}
.crow .n{font-family:var(--display);font-size:22px;text-align:center;color:var(--muted)}
.crow.p1{border-color:var(--c2);background:var(--c2-soft)}.crow.p1 .n{color:var(--c1)}
.crow.p2 .n,.crow.p3 .n{color:var(--c1)}
.crow b{font-family:var(--display);font-weight:400;font-size:17px;cursor:pointer}
.vote{font-family:var(--display);font-size:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.vote.on{background:var(--c2);border-color:var(--c1);color:#3A2A00}
/* 우리 반 */
.stampbook{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;border-radius:var(--wob);background:var(--paper);border:2px solid var(--line)}
@media (max-width:480px){.stampbook{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stamp{--c:var(--c0);aspect-ratio:1;width:100%;max-width:100%;min-width:0;min-height:0;overflow:hidden;overflow-wrap:anywhere;border-radius:50%;border:2px dashed var(--line);display:grid;place-content:center;text-align:center;font-family:var(--hand);font-size:14px;line-height:1.15;color:var(--muted);padding:6px;cursor:pointer;background:transparent}
.stamp.on{border:3px double var(--c);color:var(--c);background:var(--paper);transform:rotate(-8deg)}
.stamp.on b{font-family:var(--display);font-weight:400;font-size:13px;display:block}
.level{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.level b{font-family:var(--display);font-weight:400;font-size:24px}
.prog{height:14px;background:var(--heat0);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.prog span{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--c3) 0 6px,var(--leaf) 6px 12px)}
.quest{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px}
.quest .ok{width:20px;height:20px;border-radius:6px 8px 6px 8px;border:2px solid var(--line)}
.quest.cleared .ok{background:var(--c3);border-color:var(--leaf)}
.quest.cleared span:nth-child(2){text-decoration:line-through wavy var(--c3)}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form2>*{min-width:0}
@media (max-width:420px){.form2{grid-template-columns:minmax(0,1fr)}}
/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(18,26,48,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow:auto;background:var(--bg);border-top:3px solid var(--pencil);border-radius:26px 30px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:680px;margin:0 auto;display:grid;gap:14px;min-width:0}
.sheet h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.sheet h4{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 0}
.lyrics{white-space:pre-line;border-radius:var(--wob);padding:6px 16px;line-height:2.2em;font-family:var(--hand);font-size:21px;border:2px solid var(--line);
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 calc(2.2em - 1px),var(--c4-soft) calc(2.2em - 1px) 2.2em)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.facts div{background:var(--paper);border:2px solid var(--line);border-radius:14px 18px 14px 18px;padding:8px 10px}
.facts dt{font-family:var(--hand);font-size:15px;color:var(--muted)}
.facts dd{margin:0}
.tip{background:var(--c2-soft);border-radius:var(--wob);padding:12px 14px;transform:rotate(.4deg)}
.variant{border:2px solid var(--line);background:var(--paper);border-radius:var(--wob);padding:12px;display:grid;gap:6px}
.variant .v{white-space:pre-line;font-family:var(--hand);font-size:19px;line-height:1.5}
.variant footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.close{justify-self:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-family:var(--display);font-size:15px;z-index:30;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}
  .stamp.on{animation:press .3s ease-out}@keyframes press{from{transform:scale(1.35) rotate(-8deg)}}}
.status{display:inline-block;margin-top:8px;font-family:var(--display);font-size:13px;color:var(--muted);border:2px dashed var(--line);border-radius:999px;padding:2px 12px}
.status.on{color:var(--ink);border-style:solid;border-color:var(--c3);background:var(--c3-soft)}
a.btn{text-decoration:none;display:inline-block}
input[type=number],input[type=password]{font:inherit;width:100%;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
body.busy{cursor:progress}body.busy .btn,body.busy .stamp,body.busy .vote{pointer-events:none;opacity:.7}
.oprow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:var(--wob);padding:10px 12px}
.oprow.off{opacity:.55}
.oprow .key{font-size:13px}
.oprow b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.warn{margin:0;font-size:13.5px;color:var(--ink);background:var(--c0-soft);border-radius:10px;padding:6px 10px}
.fld{display:grid;gap:4px;min-width:0}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.form3>*{min-width:0}
textarea.plain{font-family:var(--body);font-size:15px;line-height:1.6;min-height:80px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px}
.foot{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}
.linkbtn{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.rrow.mine{outline:3px solid var(--c1);outline-offset:2px;border-radius:12px;background:var(--c1-soft)}
.rank{padding-inline:20px}
.tops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.tops{grid-template-columns:minmax(0,1fr)}}
.topcard{display:grid;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--c2-soft);border:2px solid var(--c2);border-radius:var(--wob);padding:12px 14px;min-width:0}
.topcard.sung{background:var(--c3-soft);border-color:var(--c3)}
.topcard .eyebrow{font-size:16px}
.topcard b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.done-chip{font-family:var(--display);font-size:12.5px;line-height:1.3;text-align:center;width:64px;color:var(--leaf);border:2px solid var(--c3);background:var(--c3-soft);border-radius:12px;padding:3px 6px}
</style>
</head>
<body style="margin:0">

<div class="scene">
  <svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g fill="var(--sun)"><circle cx="352" cy="38" r="20"/></g>
    <g stroke="var(--sun)" stroke-width="3" stroke-linecap="round">
      <path d="M352 8v-6M352 74v6M322 38h-6M382 38h6M331 17l-4-4M373 17l4-4M331 59l-4 4M373 59l4 4"/></g>
    <g class="cloud" fill="var(--cloud)"><ellipse cx="250" cy="34" rx="22" ry="11"/><ellipse cx="266" cy="28" rx="15" ry="12"/><ellipse cx="282" cy="35" rx="16" ry="10"/></g>

    NAT = { regions: Object.assign(emptyRegions(), b.regions || {}), songClasses: b.songClasses || {}, votes: b.votes || {}, relays: b.relays || {}, lyrics: b.lyrics || {}, total: b.classes, updated: b.updated };

}

/* ---------- 계산 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function toast(msg) { $("#toastHost").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("#toastHost").innerHTML = "", 2600); }
const classesSung = id => NAT.songClasses[id] || 0;
const votesFor = id => NAT.votes[id] || 0;
const myVoteSong = () => ME.vote && ME.vote.month === MONTH ? ME.vote.song : 0;
function variantsFor(id) {
  const pub = (NAT.lyrics[id] || []).slice();
  if (APP.live) ME.lyrics.filter(l => l.songId === id && !pub.some(p => p.key === l.id)).forEach(l => pub.push({ key: l.id, pid: ME.pid, cls: ME.name, region: ME.region, text: l.text, likes: 0, pending: true }));
  return pub.sort((a, b) => (b.pending ? 1 : 0) - (a.pending ? 1 : 0) || b.likes - a.likes);
}
const LEVELS = [[0,"노래 씨앗"],[1,"첫 소리"],[3,"작은 합창단"],[5,"노래하는 반"],[8,"동요샘 명예반"],[15,"온 나라 합창단"],[30,"노래 나무"]];
function levelOf(n) { let cur = LEVELS[0], next = null; for (const l of LEVELS) { if (n >= l[0]) cur = l; else { next = l; break } } return { cur, next } }
function latestConcert() { const s = SONGS.slice().sort((a, b) => (Number(b.year) || 0) - (Number(a.year) || 0))[0]; return s ? s.concert : ""; }
function quests() {
  const season = SEASON_OF_MONTH(new Date().getMonth());
  const ss = SONGS.filter(s => s.season === season), lc = latestConcert(), c3 = SONGS.filter(s => s.concert === lc);
  const themes = new Set(); SONGS.filter(s => ME.stamps.has(s.id)).forEach(s => s.themes.forEach(t => themes.add(t)));
  return [
   { name: `${season} 노래 모두 부르기`, have: ss.filter(s => ME.stamps.has(s.id)).length, need: Math.max(ss.length, 1) },
   { name: `${lc || "최근 발표회"} 곡 모두 부르기`, have: c3.filter(s => ME.stamps.has(s.id)).length, need: Math.max(c3.length, 1) },
   { name: "주제 다섯 가지 맛보기", have: Math.min(themes.size, 5), need: 5 },
   { name: "이어 부르기 릴레이 참여", have: ME.relays.size ? 1 : 0, need: 1 },
   { name: "우리 반 가사 올리기", have: ME.lyrics.length ? 1 : 0, need: 1 }
  ];
}

function pickToday() {

function stampBtn(id) { return ME.stamps.has(id) ? `<button class="btn done" data-stamp="${id}">불렀어요 도장 찍음</button>` : `<button class="btn ghost" data-stamp="${id}">우리 반이 불렀어요</button>`; }
function ranked() { return Object.entries(NAT.regions).sort((a, b) => b[1].stamps - a[1].stamps); }
function statusLine() {

async function act(fn, args, demo, okMsg) {
  if (!APP.live) { demo(); demoMeSave(); NAT = localNational(true); render(); refreshSheet(); if (okMsg) toast(okMsg); return true; }
  if (APP.busy) return false;
  APP.busy = true; document.body.classList.add("busy");
  try {
    const r = await rpc(fn, [APP.token].concat(args));
    setMe(r.state);
    if (r.nat && r.nat.ok) await loadNational(); else NAT = APP.collector ? NAT : localNational(false);
    render(); refreshSheet();
    if (r.nat && r.nat.error) toast("우리 반 시트에는 저장했어요. 전국 현황에는 조금 뒤 반영돼요");
    else if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    if (/로그인/.test(e.message)) { APP.token = ""; store.del("dys_token|" + APP.shellUrl); render(); }
    toast(e.message); return false;
  } finally { APP.busy = false; document.body.classList.remove("busy"); }
}
function goTab(t) { tab = t; $("#sheetHost").innerHTML = ""; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab)); render(); window.scrollTo(0, 0); }

document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close],[data-open]"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { goTab(d.tab); return; }
  if (t.hasAttribute("data-close")) { $("#sheetHost").innerHTML = ""; return; }
  if (d.open) { openSong(+d.open); return; }

  if (t.closest("[data-opzone]")) return;
  if (t.hasAttribute("data-login")) { doLogin(); return; }
  if (t.hasAttribute("data-logout")) { rpc("logout", [APP.token]).catch(() => {}); APP.token = ""; store.del("dys_token|" + APP.shellUrl); render(); toast("로그아웃했어요"); return; }
  if (t.hasAttribute("data-save")) {
    const name = $("#meName").value.trim(), region = $("#meRegion").value;
    if (!name || !region) { toast("반 이름과 지역을 모두 정해 주세요"); return; }

  }

  }
  if (t.hasAttribute("data-resend")) { act("resend", [], null, "전국으로 다시 보냈어요"); return; }
  if (!needTeacher()) return;
  if (d.stamp) { const id = +d.stamp, had = ME.stamps.has(id), s = songById(id);
    act("toggleStamp", [id, s ? s.title : ""], () => { had ? ME.stamps.delete(id) : ME.stamps.add(id); }, had ? "도장을 지웠어요" : `도장 쾅! ${ME.region} 점수가 1 올랐어요`); return; }
  if (d.vote) { const id = +d.vote, s = songById(id);
    act("vote", [id, s ? s.title : ""], () => { ME.vote = { month: MONTH, song: id }; }, `「${s ? s.title : ""}」에 투표했어요`); return; }
  if (d.relay !== undefined) { act("joinRelay", [APP.relay.id, APP.relay.song], () => { ME.relays.add(APP.relay.id); }, "릴레이를 이어받았어요. 다음 반을 기다려요"); return; }
  if (d.like) { const k = d.like; act("toggleLike", [k], () => { ME.likes.has(k) ? ME.likes.delete(k) : ME.likes.add(k); }); return; }
  if (d.addvar) { const id = +d.addvar, txt = $("#vText").value.trim(), s = songById(id);
    if (!txt) { toast("가사를 먼저 적어 주세요"); $("#vText").focus(); return; }
    act("addLyric", [id, s ? s.title : "", txt], () => { ME.lyrics.push({ id: "me-" + Date.now(), songId: id, text: txt }); }, APP.live ? "올렸어요. 운영진이 확인하면 전국에 보여요" : "우리 반 가사를 올렸어요"); return; }
  if (d.themeF) { filter.theme = filter.theme === d.themeF ? null : d.themeF; render(); return; }
  if (d.gradeF) { filter.grade = filter.grade === d.gradeF ? null : d.gradeF; render(); return; }
  if (d.mode) { filter.mode = d.mode; render(); return; }
});

}
function openSongEditor(id) {
  const d = OP.data, s = d.songs.find(x => x.id === id) || { id: 0, title: "", lyricist: "", composer: "", concert: "", year: String(new Date().getFullYear()), grade: "전 학년", themes: "", season: "", key: "", beat: "", range: "", lyrics: "", intro: "", tip: "", video: "", score: "", hidden: false };
  const picked = String(s.themes).split(/[,，、]/).map(x => x.trim()).filter(Boolean);
  const extra = picked.filter(t => !THEMES.includes(t)).join(", ");
  const concerts = [...new Set(d.songs.map(x => x.concert).filter(Boolean))];
  const f = (id, label, val, ph, type) => `<label class="fld"><span class="label">${label}</span><input type="${type || "text"}" id="${id}" value="${esc(val)}" placeholder="${esc(ph || "")}"${id === "f_concert" ? ' list="concertList"' : ""}></label>`;
  const sel = (id, label, opts, val) => `<label class="fld"><span class="label">${label}</span><select id="${id}">${opts.map(o => `<option${o === val ? " selected" : ""}>${o}</option>`).join("")}</select></label>`;
  $("#sheetHost").innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="곡 편집" data-opzone><div class="in">
    <button class="btn ghost close" data-close>닫기</button>
    <h3>${s.id ? s.id + "번 곡 고치기" : "새 곡 올리기"}</h3>
    <datalist id="concertList">${concerts.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${f("f_title", "곡 제목", s.title, "예: 운동장 한 바퀴")}
    <div class="form2">${f("f_lyricist", "작사", s.lyricist, "지은 선생님")}${f("f_composer", "작곡", s.composer, "지은 선생님")}</div>
    <div class="form2">${f("f_concert", "발표회", s.concert, "제4회 동요샘 창작동요 발표회")}${f("f_year", "발표 연도", s.year, "2026", "number")}</div>
    <div class="form2">${sel("f_grade", "추천 학년군", GRADES, s.grade || "전 학년")}${sel("f_season", "계절", ["", "봄", "여름", "가을", "겨울"], s.season)}</div>
    <span class="label">주제</span>
    <div class="chips" id="f_themes">${THEMES.map(t => `<button class="chip" data-opth="${t}" aria-pressed="${picked.includes(t)}">${t}</button>`).join("")}</div>
    ${f("f_extra", "그 밖의 주제 (쉼표로)", extra, "예: 환경, 우정")}
    <div class="form3">${f("f_key", "조성", s.key, "D")}${f("f_beat", "박자", s.beat, "2/4")}${f("f_range", "음역", s.range, "레~레")}</div>
    <label class="fld"><span class="label">가사 (줄 바꿔 적기)</span><textarea id="f_lyrics" rows="6">${esc(s.lyrics)}</textarea></label>
    <label class="fld"><span class="label">곡 소개</span><textarea id="f_intro" rows="3" class="plain">${esc(s.intro)}</textarea></label>
    <label class="fld"><span class="label">수업 활용</span><textarea id="f_tip" rows="3" class="plain">${esc(s.tip)}</textarea></label>
    ${f("f_video", "영상 주소 (https://로 시작)", s.video, "https://youtu.be/…")}
    ${f("f_score", "악보 주소 (https://로 시작)", s.score, "https://drive.google.com/…")}
    <label class="check"><input type="checkbox" id="f_hidden"${s.hidden ? " checked" : ""}> 화면에서 숨기기</label>
    <div class="btns"><button class="btn" data-opsave="${s.id}">${s.id ? "고친 내용 저장" : "곡 올리기"}</button></div>
  </div></div>`;
}
async function opLogin() {
  const pw = $("#opPw"); if (!pw || !pw.value) { toast("운영진 비밀번호를 적어 주세요"); return; }
  try { const r = await opPost("opLogin", [pw.value]);
    if (!r.ok) { toast(r.message); return; }
    OP.token = r.token; store.set("dys_op", r.token); OP.data = null; toast("들어왔어요"); render(); opEnsure();
  } catch (e) { toast(e.message); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || !t.closest("[data-opzone]")) return;
  const d = t.dataset;
  if (t.hasAttribute("data-oplogin")) { opLogin(); return; }
  if (t.hasAttribute("data-oplogout")) { opPost("opLogout", [OP.token]).catch(() => {}); OP.token = ""; OP.data = null; store.del("dys_op"); render(); toast("운영진 메뉴에서 나왔어요"); return; }
  if (d.opsub) { OP.sub = d.opsub; render(); return; }
  if (d.oplf !== undefined) { OP.lf = d.oplf; render(); return; }
  if (d.opedit !== undefined) { openSongEditor(+d.opedit); return; }
  if (d.opth) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") !== "true"); return; }
  if (d.opsave !== undefined) {
    const g = id => $("#" + id).value.trim();
    const themes = [...document.querySelectorAll("#f_themes [aria-pressed='true']")].map(b => b.dataset.opth).concat(g("f_extra").split(/[,，、]/).map(x => x.trim()).filter(Boolean));
    const song = { id: +d.opsave, title: g("f_title"), lyricist: g("f_lyricist"), composer: g("f_composer"), concert: g("f_concert"), year: g("f_year"), grade: g("f_grade"), season: g("f_season"),
      themes: [...new Set(themes)].join(", "), key: g("f_key"), beat: g("f_beat"), range: g("f_range"), lyrics: $("#f_lyrics").value.replace(/\s+$/, ""), intro: g("f_intro"), tip: g("f_tip"),
      video: g("f_video"), score: g("f_score"), hidden: $("#f_hidden").checked };
    if (!song.title) { toast("곡 제목을 적어 주세요"); $("#f_title").focus(); return; }
    if ((song.video && !/^https:\/\//.test(song.video)) || (song.score && !/^https:\/\//.test(song.score))) { toast("영상·악보 주소는 https:// 로 시작해야 해요"); return; }
    opCall("opSaveSong", [song], song.id ? "곡을 고쳤어요" : "새 곡을 올렸어요").then(ok => { if (ok) $("#sheetHost").innerHTML = ""; });
    return;
  }
  if (d.oplyric !== undefined) { opCall("opLyric", [d.oplyric, d.st], d.st === "O" ? "가사를 공개했어요" : d.st === "X" ? "가사를 숨겼어요" : "확인 전으로 돌렸어요"); return; }
  if (t.hasAttribute("data-oprelay")) { const n = $("#rName").value.trim(); if (!n) { toast("릴레이 이름을 적어 주세요"); return; } opCall("opRelay", [n, +$("#rSong").value], "릴레이를 저장했어요"); return; }
  if (d.opclass) { opCall("opClass", [d.opclass, !!d.h], d.h ? "그 반을 숨겼어요" : "그 반을 다시 보이게 했어요"); return; }
});

/* ---------- 시작 ---------- */
(async function start() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ME = APP.live ? blankMe() : demoMeLoad();
  NAT = localNational(!APP.live);
  render();
  try { const j = await fetch("national.json", { cache: "no-store" }).then(r => r.json()); if (/^https:\/\/script\.google\.com\//.test(j.collector || "")) OP.url = j.collector; } catch (e) {}
  APP.cfgLoaded = true;
  if (tab === "op") { OP.demo = !OP.url; OP.data = null; render(); }
  if (!APP.live) return;
  APP.collector = OP.url;
  const [st] = await Promise.all([rpc("getState").catch(e => ({ error: e.message })), loadNational()]);
  if (st.error) toast("우리 반 시트를 열지 못했어요: " + st.error); else setMe(st);
  if (!APP.collector) NAT = localNational(false);
  render();
})();


</script>
